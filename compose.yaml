services:
    laravel.test:
        image: 'nginx:1.27-alpine'
        ports:
            - '${APP_PORT:-8080}:80'
        volumes:
            - './docker/nginx.conf:/etc/nginx/nginx.conf:ro'
        networks:
            sail:
                aliases:
                    - laravel.test
        depends_on:
            - app
            - n8n
        restart: unless-stopped

    app:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${VITE_PORT:-51733}:${VITE_PORT:-51733}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mysql
            - mailpit

    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-33066}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s

    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1026}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8026}:8026'
        networks:
            - sail

    queue:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mysql
            - mailpit
        command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=300
        restart: unless-stopped

    n8n:
        image: 'docker.n8n.io/n8nio/n8n:latest'
        environment:
            N8N_HOST: 'vinhphu.site'
            N8N_PORT: 5678
            N8N_PROTOCOL: 'https'
            N8N_PATH: '/n8n/'
            N8N_EDITOR_BASE_URL: 'https://vinhphu.site/n8n/'
            WEBHOOK_URL: 'https://vinhphu.site/n8n/'
            TZ: 'Asia/Ho_Chi_Minh'
        volumes:
            - 'n8n_data:/home/node/.n8n'
        networks:
            - sail
        restart: unless-stopped

    cloudflared:
        image: 'cloudflare/cloudflared:latest'
        command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        networks:
            - sail
        depends_on:
            - laravel.test
            - n8n
        restart: unless-stopped

networks:
    sail:
        driver: bridge

volumes:
    sail-mysql:
        driver: local
    n8n_data:
        driver: local
